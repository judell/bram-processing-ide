<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Processing IDE</title>
  <script>
    // Sync with tools/sketch_server.py, which makes sketches/<name>.js the
    // single copy of each sketch: the editor saves to it, outside changes
    // (the agent's) are pushed back over Server-Sent Events, and so is the
    // list of sketches when one is added or removed.
    const SKETCH_SERVER = "http://127.0.0.1:55399";
    const diskCode = {};      // name -> code last known to be on disk
    const saveTimers = {};
    let syncStatus = "";  // empty when all is well; set only for "helper offline"
    const statusListeners = new Set();
    const codeListeners = new Set();
    const listListeners = new Set();
    let sketchNames = ["intro"];
    let eventSource = null;
    let pushSeq = 0;

    function setSyncStatus(s) {
      if (s === syncStatus) return;
      syncStatus = s;
      statusListeners.forEach(function (emit) { emit(s); });
    }

    function ensureEventSource() {
      if (eventSource) return;
      eventSource = new EventSource(SKETCH_SERVER + "/events");
      eventSource.onopen = function () { setSyncStatus(""); };
      eventSource.onerror = function () {
        setSyncStatus("sketch helper offline: edits run but aren't saved");
      };
      eventSource.onmessage = function (e) {
        let d;
        try { d = JSON.parse(e.data); } catch (err) { return; }
        if (d.type === "list") {
          setSketchNames(d.names);
        } else if (d.type === "code") {
          diskCode[d.name] = d.code;
          pushSeq += 1;
          codeListeners.forEach(function (emit) {
            emit({ name: d.name, code: d.code, seq: pushSeq });
          });
        }
      };
    }

    function setSketchNames(names) {
      if (!Array.isArray(names) || names.length === 0) return;
      sketchNames = names;
      listListeners.forEach(function (emit) { emit(names); });
    }

    // PushSource subscribe functions (plain functions, so each render
    // passes the same one and the PushSource doesn't resubscribe).
    // Code pushes carry the sketch name; the page keeps the ones for the
    // sketch it shows.
    function subscribeSketchCode(emit) {
      ensureEventSource();
      codeListeners.add(emit);
      return function () { codeListeners.delete(emit); };
    }
    function subscribeSketchList(emit) {
      ensureEventSource();
      listListeners.add(emit);
      emit(sketchNames);
      fetch(SKETCH_SERVER + "/sketches")
        .then(function (r) { return r.json(); })
        .then(setSketchNames)
        .catch(function () {});
      return function () { listListeners.delete(emit); };
    }
    function subscribeSyncStatus(emit) {
      ensureEventSource();
      statusListeners.add(emit);
      emit(syncStatus);
      return function () { statusListeners.delete(emit); };
    }

    function postSave(name, code) {
      return fetch(SKETCH_SERVER + "/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, code: code }),
      }).then(function (r) {
        if (!r.ok) throw new Error("save failed: " + r.status);
        diskCode[name] = code;
        setSyncStatus("");
      });
    }

    // Debounced save from the editor. Skips code that is already on disk,
    // such as a pushed change landing in the editor.
    function saveSketch(name, code) {
      clearTimeout(saveTimers[name]);
      if (code === diskCode[name]) return;
      saveTimers[name] = setTimeout(function () {
        postSave(name, code).catch(function () {
          setSyncStatus("sketch helper offline: edits run but aren't saved");
        });
      }, 400);
    }

    // "New sketch" button: brings Bram forward with the new-sketch prompt
    // (prompts/new-sketch.md, declared in .bram.json) in its message box.
    // Nothing is sent until the user presses Enter there.
    function stageNewSketch() {
      if (!window.BramDoorway) {
        setSyncStatus("New sketch: ask in Bram (doorway unavailable)");
        return;
      }
      window.BramDoorway.stage("new-sketch").catch(function (e) {
        setSyncStatus("New sketch: ask in Bram (" + ((e && e.reason) || "doorway failed") + ")");
      });
    }

    // A sketch was loaded from disk: remember its code so the editor
    // filling with it isn't saved straight back.
    function noteSketch(name, fileCode) {
      diskCode[name] = fileCode;
      return fileCode;
    }

    // "1\n2\n…\nN" for the editor's line-number gutter.
    function lineNumbers(code) {
      const n = String(code ?? "").split("\n").length;
      return Array.from({ length: n }, (_, i) => String(i + 1)).join("\n");
    }

    // Runs inside the sketch frame, before p5: forwards errors, warnings
    // and p5 Friendly Error System messages to the parent page as
    // { source: 'sketch', kind, message, line }. Line numbers refer to
    // the sketch code (see buildDoc). buildDoc inlines this function on
    // the document's first line, so its body must not use line comments.
    function sketchErrorCapture() {
      function lineFrom(stack, skip) {
        const re = /about:srcdoc:(\d+)/g;
        const s = String(stack || "");
        let m, n = 0;
        while ((m = re.exec(s))) {
          if (n++ >= (skip || 0)) return Number(m[1]);
        }
        return null;
      }
      function send(kind, message, line) {
        try {
          parent.postMessage({ source: "sketch", kind: kind, message: String(message), line: line }, "*");
        } catch (e) {}
      }
      function text(args) {
        return Array.prototype.map.call(args, function (a) {
          return typeof a === "string" ? a : (a && a.message) || String(a);
        }).join(" ").replace(/%c/g, "");
      }
      window.addEventListener("error", function (e) {
        const line = /srcdoc/.test(e.filename || "") ? e.lineno : lineFrom(e.error && e.error.stack);
        send("error", e.message, line);
      });
      window.addEventListener("unhandledrejection", function (e) {
        const r = e.reason;
        send("error", (r && r.message) || r, lineFrom(r && r.stack));
      });
      ["error", "warn", "log"].forEach(function (method) {
        const original = console[method];
        console[method] = function () {
          const msg = text(arguments);
          if (method !== "log" || msg.indexOf("p5.js says") !== -1) {
            send(method === "log" ? "p5" : method, msg, lineFrom(new Error().stack, 1));
          }
          return original.apply(console, arguments);
        };
      });
    }

    // A minimal page that runs sketch code with the vendored p5, for an
    // IFrame's srcdoc. Everything before the sketch is on line 1 and the
    // sketch starts right after <script>, so reported line numbers match
    // the editor's. "</script" in the code is escaped so it can't end the
    // tag early. The trailing run counter makes every Run a new srcdoc,
    // so unchanged code re-runs too.
    let runCount = 0;
    function buildDoc(code) {
      const safe = String(code ?? "").replace(/<\/script/gi, "<\\/script");
      const capture = "(" + sketchErrorCapture.toString().replace(/\n/g, " ") + ")();";
      runCount += 1;
      return '<!doctype html><html><head><meta charset="utf-8">' +
        '<style>body{margin:0;overflow:hidden}</style>' +
        '<script>' + capture + '</' + 'script>' +
        '<script src="/vendor/p5.js"></' + 'script></head><body>' +
        '<script>' + safe + '\n</' + 'script></body></html>' +
        '<!-- run ' + runCount + ' -->';
    }
  </script>
  <script src="/__shell/doorway.js"></script>
  <script src="/__vendor/xmlui-standalone.umd.js"></script>
</head>
<body>
</body>
</html>
